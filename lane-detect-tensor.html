<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lane Detection - Driving Assistant</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background: #000;
        color: #fff;
        overflow: hidden;
      }

      #container {
        position: relative;
        width: 100vw;
        height: 100vh;
      }

      #video {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      #canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }

      #status {
        position: absolute;
        top: 20px;
        left: 20px;
        background: rgba(0, 0, 0, 0.7);
        padding: 15px;
        border-radius: 8px;
        font-size: 16px;
        z-index: 10;
      }

      #warning {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(255, 0, 0, 0.8);
        padding: 20px 40px;
        border-radius: 10px;
        font-size: 24px;
        font-weight: bold;
        display: none;
        z-index: 20;
        animation: pulse 0.5s infinite alternate;
      }

      @keyframes pulse {
        from {
          opacity: 0.8;
        }
        to {
          opacity: 1;
        }
      }

      .center-indicator {
        position: absolute;
        width: 4px;
        height: 40px;
        background: #0f0;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        z-index: 5;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <video id="video" autoplay playsinline></video>
      <canvas id="canvas"></canvas>
      <div class="center-indicator"></div>
      <div id="status">
        <div>🎬 Initializing...</div>
        <div id="fps">FPS: 0</div>
      </div>
      <div id="warning">⚠️ VEERING OFF LANE!</div>
    </div>

    <script>
      const video = document.getElementById("video");
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");
      const statusDiv = document.getElementById("status");
      const warningDiv = document.getElementById("warning");

      let frameCount = 0;
      let lastTime = Date.now();

      async function initCamera() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: "environment",
              width: { ideal: 1280 },
              height: { ideal: 720 },
            },
          });
          video.srcObject = stream;
          video.onloadedmetadata = () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            detectLanes();
          };
        } catch (err) {
          statusDiv.innerHTML = "❌ Camera access denied";
          console.error(err);
        }
      }

      function detectLanes() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        // Get image data for lane detection
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imageData.data;

        // Simple lane detection: find white/light pixels (road markings)
        const lanes = detectWhiteLines(data, canvas.width, canvas.height);

        // Draw detected lanes
        drawLanes(lanes, canvas.width, canvas.height);

        // Check if car is centered on lane
        const carCentered = checkCarPosition(lanes, canvas.width);
        warningDiv.style.display = carCentered ? "none" : "block";

        // Update FPS
        frameCount++;
        const now = Date.now();
        if (now - lastTime >= 1000) {
          statusDiv.innerHTML = `<div>Lane Detection Active</div><div id="fps">FPS: ${frameCount}</div>`;
          frameCount = 0;
          lastTime = now;
        }

        requestAnimationFrame(detectLanes);
      }

      function detectWhiteLines(data, width, height) {
        const lanes = [];
        const bottomSection = Math.floor(height * 0.6);

        for (let y = bottomSection; y < height; y += 5) {
          let leftEdge = -1;
          let rightEdge = -1;

          for (let x = 0; x < width; x++) {
            const idx = (y * width + x) * 4;
            const r = data[idx];
            const g = data[idx + 1];
            const b = data[idx + 2];

            // Detect white/yellow lane markings
            if (
              (r > 180 && g > 180 && b > 150) ||
              (r > 180 && g > 150 && b < 100)
            ) {
              if (leftEdge === -1) leftEdge = x;
              rightEdge = x;
            }
          }

          if (leftEdge !== -1 && rightEdge !== -1) {
            lanes.push({
              y,
              leftEdge,
              rightEdge,
              center: (leftEdge + rightEdge) / 2,
            });
          }
        }

        return lanes;
      }

      function drawLanes(lanes, width, height) {
        if (lanes.length === 0) return;

        // Draw lane boundaries with gradient
        ctx.strokeStyle = "rgba(0, 255, 0, 0.6)";
        ctx.lineWidth = 3;
        ctx.beginPath();

        for (let i = 0; i < lanes.length; i++) {
          const lane = lanes[i];
          if (i === 0) {
            ctx.moveTo(lane.leftEdge, lane.y);
          } else {
            ctx.lineTo(lane.leftEdge, lane.y);
          }
        }
        ctx.stroke();

        ctx.strokeStyle = "rgba(0, 255, 0, 0.6)";
        ctx.beginPath();
        for (let i = 0; i < lanes.length; i++) {
          const lane = lanes[i];
          if (i === 0) {
            ctx.moveTo(lane.rightEdge, lane.y);
          } else {
            ctx.lineTo(lane.rightEdge, lane.y);
          }
        }
        ctx.stroke();

        // Fill lane area
        ctx.fillStyle = "rgba(0, 255, 0, 0.1)";
        ctx.beginPath();
        for (let i = 0; i < lanes.length; i++) {
          ctx.lineTo(lanes[i].leftEdge, lanes[i].y);
        }
        for (let i = lanes.length - 1; i >= 0; i--) {
          ctx.lineTo(lanes[i].rightEdge, lanes[i].y);
        }
        ctx.fill();
      }

      function checkCarPosition(lanes, width) {
        if (lanes.length === 0) return true;

        const bottomLane = lanes[lanes.length - 1];
        const carCenterX = width / 2;
        const laneCenterX = bottomLane.center;
        const threshold = 60;

        return Math.abs(carCenterX - laneCenterX) < threshold;
      }

      initCamera();
    </script>
  </body>
</html>
